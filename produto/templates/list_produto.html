{% extends 'base.html' %}
{% block product %}
<div class="head_content">
    <h1 class="page_title">Produtos</h1>

    <div class="pageButtons">
        <a class="btn home" href="{% url 'index' %}">Home</a>
        <a class="btn new" href="{% url 'produto:new_produto' %}">Novo Produto</a>
    </div>
</div>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Cor</th>
            <th>Preco</th>
            <th>Quantidade</th>
            <th></th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for produto in produtos %}
        <tr>
            <th>{{ produto.id }}</th>
            <td>{{ produto.produto }}</td>
            <td>{{ produto.cor }}</td>
            <td>{{ produto.preco }}</td>
            <td>{{ produto.quantidade }}</td>
            <td><a class="btnTable updateBtn" href="{% url 'produto:update_produto' produto.id %}">Editar</a></td>
            <td><a class="btnTable deleteBtn" href="{% url 'produto:delete_produto' produto.id %}">Deletar</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
