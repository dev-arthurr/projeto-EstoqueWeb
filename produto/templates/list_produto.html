{% extends 'base.html' %}
{% block product %}

<p>Produto</p>
<a href="{% url 'index' %}">Home</a>
<a href="{% url 'produto:new_produto' %}">Novo Produto</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Cor</th>
            <th>Preco</th>
            <th>Quantidade</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for produto in produtos %}
        <tr>
            <th>{{ produto.id }}</th>
            <td>{{ produto.produto }}</td>
            <td>{{ produto.cor }}</td>
            <td>{{ produto.preco }}</td>
            <td>{{ produto.quantidade }}</td>
            <td><a href="{% url 'produto:update_produto' produto.id %}">Update</a></td>
            <td><a href="{% url 'produto:delete_produto' produto.id %}">Delete</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
