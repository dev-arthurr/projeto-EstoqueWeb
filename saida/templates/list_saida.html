{% extends 'base.html' %}
{% block product %}
<div class="head_content">
    <h1 class="page_title">Saidas</h1>

    <div class="pageButtons">
        <a class="btn home" href="{% url 'index' %}">Home</a>
        <a class="btn new" href="{% url 'saida:new_saida' %}">Nova Saída</a>
    </div>
</div>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço unit.</th>
            <th>Data</th>
            <th></th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for saida in saidas %}
        <tr>
            <th>{{ saida.id }}</th>
            <td>{{ saida.produto }}</td>
            <td>{{ saida.quantidade }}</td>
            <td>{{ saida.preco_unitario }}</td>
            <td>{{ saida.created }}</td>
            <td><a class="btnTable updateBtn" href="{% url 'saida:update_saida' saida.id %}">Editar</a></td>
            <td><a class="btnTable deleteBtn" href="{% url 'saida:delete_saida' saida.id %}">Deletar</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
