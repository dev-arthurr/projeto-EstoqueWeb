{% extends 'base.html' %}
{% block product %}

<div class="form-container">
    <h1>Formulário de Entradas</h1>

    <form method="post" class="form-styles">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}

            {% if field.errors %}
            <span class="error-message">{{ field.errors }}</span>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn-submit">Salvar</button>
    </form>
</div>

{% endblock %}
