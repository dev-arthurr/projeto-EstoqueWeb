{% extends 'base.html' %}
{% block product %}

<p>Entrada</p>
<a class="button is-primary" href="{% url 'index' %}">Home</a>
<a class="button is-primary" href="{% url 'entrada:new_entrada' %}">Nova Entrada</a>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        {% for entrada in entradas %}
        <tr>
            <th>{{ entrada.id }}</th>
            <td>{{ entrada.produto }}</td>
            <td>{{ entrada.preco }}</td>
            <td>{{ entrada.quantidade }}</td>
            <td><a class="button is-primary" href="{% url 'entrada:update_entrada' entrada.id %}">Atualizar</a></td>
            <td><a class="button is-primary" href="{% url 'entrada:delete_entrada' entrada.id %}">Deletar</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
