{% extends 'base.html' %}
{% block product %}
<div class="head_content">
    <h1 class="page_title">Entradas</h1>

    <div class="pageButtons">
        <a class="btn home" href="{% url 'index' %}">Home</a>
        <a class="btn new" href="{% url 'entrada:new_entrada' %}">Nova Entrada</a>
    </div>
</div>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preco</th>
            <th></th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        {% for entrada in entradas %}
        <tr>
            <th>{{ entrada.id }}</th>
            <td>{{ entrada.produto }}</td>
            <td>{{ entrada.preco }}</td>
            <td>{{ entrada.quantidade }}</td>
            <td><a class="btnTable updateBtn" href="{% url 'entrada:update_entrada' entrada.id %}">Editar</a></td>
            <td><a class="btnTable deleteBtn" href="{% url 'entrada:delete_entrada' entrada.id %}">Deletar</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
